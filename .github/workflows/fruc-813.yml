name: FRUC raw output - Windows x64

on:
  push:
    branches:
      - test/fruc-813-raw
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x64:
    runs-on: windows-2022
    timeout-minutes: 100
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout exact commit and submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Fetch upstream build dependencies
        run: |
          curl -fSL -o ffmpeg_lgpl.7z https://github.com/rigaya/ffmpeg_dlls_for_hwenc/releases/download/20260812/ffmpeg_dlls_for_hwenc_20260812.7z || exit /b 1
          7z x -offmpeg_lgpl -y ffmpeg_lgpl.7z || exit /b 1
          curl -fSL -o hwenc_headers.7z https://github.com/rigaya/ffmpeg_dlls_for_hwenc/releases/download/20250830/hwenc_headers_20260411.7z || exit /b 1
          7z x -o.. -y hwenc_headers.7z || exit /b 1
          curl -fSL -o onnxruntime.zip https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-win-x64-gpu-1.23.2.zip || exit /b 1
          7z x -oonnxruntime -y onnxruntime.zip || exit /b 1
          curl -fSL -o nvof.7z https://github.com/rigaya/NVEnc/releases/download/7.42/NVEncNVOFFRUC_20240303_x64.7z || exit /b 1
          7z x -oNVEncNVOFFRUCBin -y nvof.7z || exit /b 1
          curl -fSL -o ngx.7z https://github.com/rigaya/NVEnc/releases/download/9.35/NVEncNVSDKNGX_20260925_x64.7z || exit /b 1
          7z x -oNVEncNVSDKNGXBin -y ngx.7z || exit /b 1
          curl -fSL -o vship.7z https://github.com/rigaya/ffmpeg_dlls_for_hwenc/releases/download/20250830/libvship_nvidia_5_0.7z || exit /b 1
          7z x -olibvship_nvidia_5_0 -y vship.7z || exit /b 1

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Install CUDA 11.8 compiler and headers
        run: |
          curl -fSL -o cuda_installer.exe https://developer.download.nvidia.com/compute/cuda/11.8.0/network_installers/cuda_11.8.0_windows_network.exe || exit /b 1
          cuda_installer.exe -s nvcc_11.8 cudart_11.8 curand_11.8 curand_dev_11.8 npp_11.8 npp_dev_11.8 nvml_dev_11.8 nvrtc_11.8 nvrtc_dev_11.8 visual_studio_integration_11.8 || exit /b 1

      - name: Compile RelStatic x64
        run: |
          chcp 932
          set AVISYNTH_SDK=${{ github.workspace }}\..\AviSynthPlus\avs_core
          set VAPOURSYNTH_SDK=${{ github.workspace }}\..\vapoursynth
          set OPENCL_HEADERS=${{ github.workspace }}\..\openclheaders
          set VSHIP_DIR=${{ github.workspace }}\..\vship
          set ONNXRUNTIME_DIR=${{ github.workspace }}\onnxruntime\onnxruntime-win-x64-gpu-1.23.2
          set CUDA_PATH=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v11.8
          set CUDA_PATH_V11_8=%CUDA_PATH%
          msbuild NVEnc.sln /t:NVEncC /p:Configuration=RelStatic /p:Platform=x64 -maxcpucount || exit /b 1

      - name: Smoke-test and stage executable only
        run: |
          set "EXE=_build\x64\RelStatic\NVEncC64.exe"
          if not exist "%EXE%" exit /b 1
          "%EXE%" --version || exit /b 1
          "%EXE%" --check-cmd-parse || exit /b 1
          "%EXE%" --check-cmd-parse help || exit /b 1
          mkdir NVEncC_FRUC_813_EXE
          copy "%EXE%" NVEncC_FRUC_813_EXE\ || exit /b 1

      - name: Upload test artifact only (no release or tag)
        uses: actions/upload-artifact@v4
        with:
          name: NVEncC_FRUC_813_EXE_x64
          path: NVEncC_FRUC_813_EXE/
          retention-days: 14
          if-no-files-found: error
